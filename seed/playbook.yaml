# Playbook theo loại sự cố. Khoá (lighting, plumbing, ...) khớp với Shift.skill.
# checklist.code là mã kỹ thuật viên tick khi nộp bằng chứng.

lighting:
  title: Sửa/thay đèn khu vực chung
  sla_accept_minutes: 30
  sla_resolve_hours: 4
  requires_materials: true
  required_photos: [before, after]
  steps:
    - Đến đúng vị trí, chụp ảnh đèn hỏng (ảnh trước).
    - Kiểm tra aptomat/nguồn tầng. Nếu nghi lỗi điện (aptomat nhảy, dây nóng, mùi khét) thì DỪNG và báo BQL.
    - Ngắt nguồn, thay bóng/bộ đèn đúng loại.
    - Bật lại, kiểm tra đèn sáng ổn định, chụp ảnh sau khi sửa.
    - Khai báo vật tư đã dùng.
  checklist:
    - code: diagnose
      label: Đã kiểm tra nguồn/aptomat, không có dấu hiệu lỗi điện
    - code: power_off
      label: Đã ngắt nguồn trước khi thay
    - code: replace
      label: Đã thay bóng/bộ đèn
    - code: test
      label: Đèn sáng ổn định sau khi thay

plumbing:
  title: Xử lý rò rỉ nước khu vực chung
  sla_accept_minutes: 20
  sla_resolve_hours: 6
  requires_materials: false
  required_photos: [before, after]
  steps:
    - Đến vị trí, chụp ảnh chỗ rò rỉ (ảnh trước).
    - Khoá van cấp nước nhánh nếu cần.
    - Xử lý rò rỉ, lau khô khu vực.
    - Chụp ảnh sau khi xử lý.
  checklist:
    - code: isolate
      label: Đã khoá van/khoanh vùng rò rỉ
    - code: fix
      label: Đã xử lý điểm rò rỉ
    - code: clean
      label: Đã lau khô, đặt biển cảnh báo nếu sàn trơn

elevator:
  title: Kiểm tra lỗi nhỏ thang máy (đèn cabin, nút bấm, tiếng kêu)
  sla_accept_minutes: 15
  sla_resolve_hours: 2
  requires_materials: false
  required_photos: [before, after]
  steps:
    - Kiểm tra thang có người bên trong không. Có người mắc kẹt thì báo BQL và gọi cứu hộ ngay.
    - Chụp ảnh lỗi (ảnh trước).
    - Xử lý lỗi nhỏ; lỗi cơ khí/điều khiển thì báo BQL để gọi đơn vị bảo trì thang máy.
    - Chạy thử thang, chụp ảnh sau khi xử lý.
  checklist:
    - code: safety_check
      label: Đã xác nhận không có người mắc kẹt
    - code: fix
      label: Đã xử lý lỗi
    - code: test_run
      label: Đã chạy thử thang ổn định
