# TỪ VỰNG P0 — tầng an toàn + priority (CR-BPTN-03 §6, §7), bản WP3c (luật R1–R10 của judge, plan.md Q29).
# NGUỒN CHÂN LÝ dữ liệu: file này (01-CONTRACTS.md §5.0). LEXICON-P0.yaml trong specs/ chỉ còn là lịch sử WP3.
# Mọi cụm thường (cue, đệm, tập đóng, tiểu từ, token nối, gốc R9) = chữ thường KHÔNG dấu, cách nhau đúng MỘT khoảng trắng.
# Pattern là cụm thường (khớp nguyên cụm, có ranh giới từ) trừ khi bắt đầu bằng "re:" (regex Python thô).
# Dạng CÓ dấu (homographs, homograph_intended, tier2_net_roots, benign_lamp_noun_forms) = NFC chữ thường, bỏ dấu ra đúng khoá.
# Bẫy YAML 1.1: token trần no/yes/on/off/y/n/true/false bị đọc thành bool => phải đặt trong nháy.
lexicon_version: "2026-10-02.p0c"
synthetic: true

safety:
  active_phases: [P0]
  # ---- R1/R3/R4 (phủ định): cue + 0..scope_max_fillers đệm kết thúc ngay trước tín hiệu, trong mệnh đề, cửa sổ <= scope_max_chars
  scope_max_fillers: 2
  scope_max_chars: 80
  negation_prefixes: [khong co, khong thay, khong he, khong hai, khong con, chua thay, khong ngui thay, khong nghe thay,
                      khong phai, chang co, khong bi, khong co dau hieu, ko co, ko thay, hok co,                       # Q31.A: bỏ k co / k thay (khớp mã toà/khu)
                      
                      khong phat hien, chang thay,          # Q29 (cue thêm của judge)
                      khong phai la, chang phai]            # A4: phủ định kép "không phải là không có khói" => UNCLEAR
  negation_fillers: [co, thay, bi, he, duoc, con]          # R1 (Q29, từng chữ)
  person_negation_cues: [khong ai, khong co ai, khong thay ai, khong thay nguoi nao, khong co nguoi nao, khong nguoi nao,
                         chua thay ai, chua co ai, khong co nguoi, khong thay nguoi, khong thay co nguoi]   # R3 (+A4: 5 mục cuối)
  person_signal_ids: [S-09]
  coordination_conjunctions: [hay, hoac, lan]               # R4
  coordination_hazard_tokens: [khoi, lua, khet, chay, "no", xet, ho]   # R4/A3 — "no" PHẢI có nháy (YAML 1.1: no => False)
  coordination_hazard_exclusions: [chua chay, bao chay, phong chay]    # Q31.D: thiết bị/hệ thống, không phải đám cháy
  hedges:                    # R5: cue nghi ngờ (cùng luật R1 với đệm riêng)
    - hinh nhu
    - co ve
    - nghe nhu
    - nghi la
    - nghi co
    - khong chac
    - chua ro
    - co le
    - giong nhu
    - cam giac nhu
    - co the la
    - khong biet co phai
    - khong ro co phai
    - duong nhu
  hedge_forms:               # Q31.B: cue hedge chỉ tính khi viết ĐÚNG dấu (tên "Cô Lê" không phải "có lẽ")
    hinh nhu: [hình như]
    co ve: [có vẻ]
    nghe nhu: [nghe như]
    nghi la: [nghĩ là]
    nghi co: [nghĩ có]
    khong chac: [không chắc]
    chua ro: [chưa rõ]
    co le: [có lẽ]
    giong nhu: [giống như]
    cam giac nhu: [cảm giác như]
    co the la: [có thể là]
    khong biet co phai: [không biết có phải]
    khong ro co phai: [không rõ có phải]
    duong nhu: [dường như]
  hedge_fillers: [co, thay, bi, la, nhu, dang]
  resolved_markers:          # T2-02: sự việc đã xảy ra và đã hết (đứng SAU tín hiệu, sau nó chỉ còn tiểu từ)
    - gio het roi
    - het roi
    - da het
    - khong con nua
    - gio khong con
    - da tat
    - gio binh thuong
    - gio on roi
    - da on
    - gio da het
  final_particles: [roi, a, nhe, nha, thoi, nua, ha, day, luon]
  resolved_bridge_tokens: [ra, len, xuong, gio, bay, hien, luc, nay, thi, cung, da]   # A2
  benign_phrases:            # B-01: cụm lành tính của đèn -> NONE, ghi T2-03 ABSENT (rule B-01) kèm trích dẫn
    - "re:\\b(bong|den|bong den|den tuyp|bong tuyp|tuyp)( bi| da| cung| lai)? ?(chay|hong|chap chon|nhap nhay|no)\\b"
    - "re:\\b(chay|no|hong) (bong|den|bong den|tuyp)\\b"
    - chap chon
    - nhap nhay
    - no bong
    - chay bong
  # ---- R6/A1 (B-01): tập đóng tiền tố <= b01_max_prefix_tokens token; danh từ đèn phải là dạng CÓ dấu đã chứng minh
  benign_lamp_nouns: [bong den, bong tuyp, den tuyp, den led, bong, den, tuyp, chieu sang]
  benign_lamp_noun_forms: {bong: [bóng], den: [đèn], tuyp: [tuýp, tuyp], chieu: [chiếu], sang: [sáng]}
  b01_prefix_words: [sanh thang may, sanh chinh, sanh, hanh lang, cau thang bo, cau thang, thang bo, thang may, ham xe, ham,
                     phong rac, phong, khu vuc, khu, tang, toa, lau, block, sim, o, tai, cua, tren, duoi, trong, ngoai, truoc,
                     he thong, loi di, loi thoat hiem, nha xe,
                     bi, da, lai, cung, vua, moi, hay, thi, cai, cac, may, mot, hai, nhung, deu, dang]
  b01_code_token_regex: "[a-z]?\\d+[a-z]?|[a-z]"
  b01_max_prefix_tokens: 20
  benign_with_lamp_noun: [chay]
  ambiguous_terms:           # B-03 / T2-03: đứng riêng (không benign, không có Bậc 1 kèm) -> Bậc 2
    - "re:\\bchay\\b"
    - "re:\\bchap( dien| mach| chay)?\\b"
    - dien giat
    - giat dien
    - bi giat
    - giat tay
  # ---- R7: đồng tự theo token CÓ dấu, theo từng pattern
  homographs:
    chay: [chảy, chạy]
    ngat: [ngắt]
    ho: [hộ, hồ, họ, hổ, hố, hô, hò]
    khoi: [khối, khỏi, khơi]
    lua: [lựa, lúa, lừa, lụa]
    day: [dãy, đầy, dạy, dày, đây, đẩy, dậy, dấy, đày]
    giat: [giặt]
    "no": [nó, nò, nỏ, nõ, nọ]                              # Q31 vocabulary: "nổ" khác "nó" (PHẢI có nháy: YAML 1.1)
    bong: [bong, bóng, bòng, bõng, bọng, bông, bống, bồng, bổng, bỗng, bộng]   # Q31 vocabulary: "bỏng" (burn) khác các dạng khác
  homograph_confirmers:      # Q31.C: từ đồng hiện trong cùng mệnh đề giữ lại match đồng tự (gõ sai dấu vẫn là tín hiệu)
    khoi: [boc, bay, len, toa, mui, mu, um]
    lua: [boc, len, toe, bung, hop dien, tu dien, o cam]
    ngat: [nguoi, bi, xiu, nga, bat]
    ho: [ra, day, lo, tran, thong]
    chay: [lua, khoi, khet, boc, mau]
  homograph_intended:                                      # judge: 5 mục đầu; A4: pattern chắc nghĩa (gõ sai dấu không làm mất match)
    chay mau: {chay: [chảy]}
    nga khong day: {day: [dậy]}
    khong day duoc: {day: [dậy]}
    khong dung day duoc: {day: [dậy]}
    day khoi: {day: [đầy]}
    tia lua: {lua: [lựa, lúa, lừa, lụa]}
    toe lua: {lua: [lựa, lúa, lừa, lụa]}
    xet lua: {lua: [lựa, lúa, lừa, lụa]}
    ngon lua: {lua: [lựa, lúa, lừa, lụa]}
    ban tia lua: {lua: [lựa, lúa, lừa, lụa]}
    phat tia lua: {lua: [lựa, lúa, lừa, lụa]}
    ngat xiu: {ngat: [ngắt]}
    co khoi: {khoi: [khối, khỏi, khơi]}                      # Q31.C
    boc khoi: {khoi: [khối, khỏi, khơi]}
    khoi boc: {khoi: [khối, khỏi, khơi]}
    lua boc: {lua: [lựa, lúa, lừa, lụa]}
    "re:\\bbi ngat\\b(?! (dien|cau dao|nguon|mach|may|quang|ket noi|dong|nuoc|den|wifi|mang|he thong|nguong|ngay))": {ngat: [ngắt]}
    ngat di: {ngat: [ngắt]}
    day dien ho: {ho: [hộ, hồ, họ, hổ, hố, hô, hò]}
    day dien ho ra: {ho: [hộ, hồ, họ, hổ, hố, hô, hò]}
    bi bong: {bong: [bỏng]}                                  # Q31 vocabulary: không có trong homographs.bong => giữ
  # ---- R9: lưới Bậc 2 cho "khói/lửa/máu/bất động" (dạng có dấu) nằm ngoài mọi span
  tier2_net_roots: {khoi: [khói], lua: [lửa], mau: [máu], bat dong: [bất động]}
  ambiguous_exclusions:      # từ đồng tự không phải rủi ro (chảy nước, ...): bỏ qua, không ghi
    - nuoc chay
    - chay nuoc
    - chay ra
    - chay xuong
    - chay tran
    - chay lenh lang
    - chay dai
    - ro ri chay
    - chay nhua
    - phong chay                 # R10: "phòng/chữa cháy"
    - chua chay
    - khoi thuoc                 # A4: nguồn khói lành tính (R9 coi là span loại trừ)
    - khoi huong
    - khoi nhang
  khet_benign_contexts: []   # Q31.B: không còn ngữ cảnh nấu ăn không dấu (tên "chị Nương", "anh Chiến" khớp "nướng/chiên")
  khet_benign_contexts_accented:  # B-04: so khớp trên văn bản GỐC chữ thường CÓ dấu; văn bản không dấu không bị hạ mức
    - cơm
    - thức ăn
    - đồ ăn
    - bếp
    - chiên
    - nướng
    - xào
    - bánh
    - thịt
    - món ăn
    - nấu
  khet_electric_contexts:     # B-04: có từ điện trong câu thì "khét" giữ Bậc 1
    - dien
    - o cam
    - cong tac
    - cau dao
    - den
    - day cap
    - may bien ap
    - quat
  clause_conjunctions: [va, nhung, ma, roi]   # ngắt mệnh đề cho phủ định, hedge, marker ("va" bắt buộc)
  components:                # thành phần cho tín hiệu tổ hợp S-14 / T2-05
    - component_id: unknown_substance
      patterns:
        - "re:\\bchat (long |bot |ran |nhon |ban )?la\\b"
        - khong ro nguon goc
        - chat khong ro
        - chat gi do
        - dung dich la
        - bot la
        - chat long khong ro
    - component_id: hazard_sign
      patterns:
        - mui hac
        - mui xoc
        - mui hoa chat
        - mui nong
        - boc hoi
        - an mon
        - kho tho
        - cay mat
        - ngat mui
        - chong mat
        - buon non
        - rat da
        - bong rat
  signals:
    # ---- Bậc 1 (tier 1) ----
    - {signal_id: S-01, name: burning_smell, tier: 1, phase: P0, scope: [KY_THUAT, COMMON],
       patterns: [mui khet, khet let, khet nhu nhua chay, mui chay khet, "re:\\bkhet\\b"]}
    - {signal_id: S-02, name: spark, tier: 1, phase: P0, scope: [KY_THUAT, COMMON],
       patterns: [tia lua, toe lua, xet dien, xet lua, ban tia lua, phat tia lua]}
    - {signal_id: S-03, name: exposed_wire, tier: 1, phase: P0, scope: [KY_THUAT],
       patterns: [day dien ho, day tran, day dut loi ra, lo day, ho day, day dien bi dut, day dien loi ra, day dien dut, loi day dien, day ho,
                  day dien bi ho, day bi ho, ho dien, dien ho, day dien ho ra, day dien tran, day dien thong, day dien bi loi, day dien loi,
                  day dien bi tran, day dien bi tran ra]}
    - {signal_id: S-04, name: smoke, tier: 1, phase: P0, scope: [COMMON],
       patterns: [co khoi, boc khoi, khoi bay, khoi den, khoi trang, kem khoi, xi khoi, toa khoi, nhieu khoi, thay khoi, khoi boc, khoi bay ra, mui khoi,
                  khoi mu, mu khoi, khoi dac, ngap khoi, khoi cuon, day khoi, con khoi, khoi um, khoi lan, toan khoi, khoi nghi ngut]}
    - {signal_id: S-05, name: fire, tier: 1, phase: P0, scope: [COMMON],
       patterns: [boc chay, dang chay, co lua, chay hop dien, hop dien chay, hop dien boc chay, hop den chay, chay hop den, lua chay, ngon lua, chay lon, chay bung, phat no, chay no, chap chay, bat lua, chay thanh ngon,
                  hoa hoan, chay nha, dam chay, chay lan, lua boc, thay lua,
                  "re:\\b(tu dien|o cam|day dien|cong tac|hop dien|cau dao)(?: (?!khong\\b|ko\\b|chua\\b|chang\\b|den\\b|bong\\b|tuyp\\b)\\w+){0,8}(?: (?:dang|bi|da))* chay\\b(?! (cham|lien tuc|suot|thu|on|binh thuong|manh|yeu|ngam|tot|lai))",
                  lua to, lua bung, lua lan, boc lua, phong lua,
                  "re:(?<!nuoc )\\bchay (?:sang|ra)\\b",
                  "re:\\b(hop dien|tu dien|o cam|cong tac|cau dao|day dien|may bien ap)(?: (?!khong\\b|ko\\b|chua\\b|chang\\b|den\\b|bong\\b|tuyp\\b)\\w+){0,8} no\\b"]}
    - {signal_id: S-06, name: electric_shock, tier: 1, phase: P1, scope: [COMMON],
       patterns: [bi dien giat, dien giat, giat tay khi cham, ro dien, ro ri dien, te dien]}
    - {signal_id: S-07, name: overheat, tier: 1, phase: P1, scope: [KY_THUAT],
       patterns: [nong bong tay, chay nhua, chay xem, bien dang vi nong, nong ran, qua nong]}
    - {signal_id: S-08, name: water_in_electrics, tier: 1, phase: P1, scope: [KY_THUAT],
       patterns: [nuoc nho vao hop dien, nuoc vao hop dien, nuoc tran vao o cam, nuoc vao o cam, nuoc vao tu dien, nuoc chay vao hop dien, nuoc nho vao den]}
    - {signal_id: S-09, name: person_hurt_or_trapped, tier: 1, phase: P0, scope: [COMMON],
       patterns: [bi thuong, chay mau, nga dap dau, ngat xiu,
                  "re:\\bbi ngat\\b(?! (dien|cau dao|nguon|mach|may|quang|ket noi|dong|nuoc|den|wifi|mang|he thong|nguong|ngay))",   # Q31.C: "bị ngắt điện/nước" không phải ngất
                  ngat di, bat tinh, mac ket, ket nguoi, cap cuu, nguoi bi nga, gay chan, gay tay,
                  "re:\\bngat\\b(?! (dien|cau dao|nguon|mach|may|quang|ket noi|dong|nuoc|den|wifi|mang|he thong|nguong|ngay))",
                  bi xiu, xiu di, ket thang may,
                  dot quy, co giat, nga khong day, khong dung day duoc, khong day duoc,
                  nguoi bi ket, bi ket trong thang may, ket trong thang may, ket ben trong,
                  bi bong, nguoi ben trong khong ra duoc]}
    - {signal_id: S-10, name: gas_smell, tier: 1, phase: P1, scope: [COMMON],
       patterns: [mui gas, mui ga, mui khi dot, ro ri gas, xi gas]}
    - {signal_id: S-11, name: falling_object, tier: 1, phase: P1, scope: [COMMON],
       patterns: [sap roi, den roi, roi xuong, tran sap, kinh vo roi, sap sap, roi trung, rung roi]}
    - {signal_id: S-12, name: chemical_spill, tier: 1, phase: P1, scope: [VE_SINH, COMMON],
       patterns: [hoa chat do, do hoa chat, tran hoa chat, chat long mui hac, axit, acid]}
    - {signal_id: S-13, name: biohazard, tier: 1, phase: P1, scope: [VE_SINH],
       patterns: [kim tiem, bom kim tiem, mau, vet mau, chat thai y te, bang gac]}
    - {signal_id: S-14, name: unknown_substance_with_hazard, tier: 1, phase: P0, scope: [VE_SINH],
       all_of: [unknown_substance, hazard_sign]}
    # ---- Bậc 2 (tier 2) ----
    - {signal_id: T2-03, name: ambiguous_term_alone, tier: 2, phase: P0, scope: [COMMON], patterns: []}   # sinh từ ambiguous_terms
    - {signal_id: T2-04, name: abnormal_sound, tier: 2, phase: P0, scope: [COMMON],
       patterns: [xeo xeo, keu xeo, u lon, u rat lon, keu u, tieng u, lop bop, lach tach, tieng no, tieng xet, ret ret, keu re re]}
    - {signal_id: T2-05, name: cleaning_single_hazard, tier: 2, phase: P0, scope: [VE_SINH], any_of: [unknown_substance, hazard_sign]}
    # T2-01 (nghi ngờ) và T2-02 (đã xảy ra) không phải tín hiệu riêng: chúng hạ tín hiệu Bậc 1 thành UNCLEAR
    # (rule_id ghi T2-01 / T2-02 trên RiskSignal của S-xx).

priority:
  high_areas: ["Hành lang", "Sảnh chính", "Sảnh thang máy", "Cầu thang bộ", "Hầm xe"]   # PRI-H1: lối đi chung
  obstruction_patterns:      # PRI-H2: cản trở lối đi
    - chan loi
    - chan het loi
    - chan ngang
    - can loi
    - tron truot
    - "re:\\btron\\b"
    - tran ra loi
    - khong di duoc
    - khong qua duoc
    - do ra loi di
    - lenh lang
    - ngap nuoc
    - tran het
    - chan loi di
  usage_impact_patterns:     # PRI-M2: ảnh hưởng sử dụng, chưa cản trở
    - nhieu rac
    - day rac
    - rac tran
    - rac vuong vai
    - vet ban
    - dinh ban
    - am uot
    - "re:\\buot\\b"
    - "re:\\bmui\\b"
    - "re:\\bhoi\\b"
    - vung nuoc
    - do tran
    - do nuoc
    - bai non
    - chat long
    - chat thai
    - boc mui
  # R1 là MỘT luật: bốn khoá dưới PHẢI bằng safety (V-12)
  negation_prefixes: [khong, ko, chang, chua]
  negation_fillers: [co, thay, bi, he, duoc, con]
  scope_max_fillers: 2
  scope_max_chars: 80
  clause_conjunctions: [va, nhung, ma, roi]
