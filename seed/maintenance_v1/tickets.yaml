# MaintenanceOps Agent — 12 synthetic tickets (6 vệ sinh, 6 kỹ thuật), 4 demo flow + 8 regression.
# SIMULATED: nội dung, vị trí, vật tư và kết quả đều mô phỏng; không có dữ liệu cư dân hoặc vận hành thật.
#
# Mỗi ticket gồm:
#   raw          — lớp nguồn cư dân, bất biến sau ingest (được replay đúng tại created_at)
#   materials    — vật tư dự kiến cho bước 7 (không có = Agent lấy mặc định theo playbook)
#   execution    — việc phòng ban làm sau khi nhận việc, kết thúc bằng "báo hoàn thành" (bước 10).
#                  Chỉ chạy khi ticket ROUTED và không có blocker. Không kịch bản nào đóng ticket: chỉ BQL đóng.
#   expected     — oracle kết quả cuối cùng sau khi chạy hết kịch bản
#
# CR-BPTN-03 (v0.6 candidate): tầng an toàn 2b chạy trước phân loại; CLN-004/TEC-005 là Bậc 1 (EMERGENCY_PENDING_BQL). Nội dung raw giữ nguyên.
