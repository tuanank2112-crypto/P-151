      material_stock_status: UNKNOWN
      draft_exists: true
      route_status: NOT_ROUTED
      queue_reason: MATERIAL_STOCK_UNKNOWN
      state: CHỜ XÁC MINH
      rule_id: PB-COM-R-STK-02
