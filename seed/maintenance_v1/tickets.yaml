      evidence:
        - {requirement_id: CLN-EVD-PROCESSING-NOTE, evidence_type: PROCESSING_NOTE, content_or_metadata: "Ghi chú xử lý mô phỏng: đã thu gom rác và lau sàn hành lang", readability_status: NOT_APPLICABLE}
        - {requirement_id: null, evidence_type: SIMULATED_IMAGE, content_or_metadata: "Ảnh mô phỏng: hành lang sau khi dọn", readability_status: READABLE}
    expected:
      status: READY_FOR_REVIEW
      reason_code: null
      risk_level: NONE
      priority: MEDIUM
      playbook_id: PB-CLN-01
      proposed_department_id: DEPT_CLEANING
      department_id: DEPT_CLEANING
      review_status: NOT_REQUIRED
      asset_resolution: NOT_APPLICABLE
