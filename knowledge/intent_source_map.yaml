    coverage_status: Partial
    known_gaps:
      - Quy trình chuyển đồ chưa nêu các trường trong mẫu, SLA phê duyệt, cách sửa hoặc hủy đăng ký và cách tính thời hạn trước 04 giờ.
      - Đối với hồ sơ thi công, mẫu hồ sơ, kênh hoặc địa điểm nộp và giờ tiếp nhận chưa được cung cấp đầy đủ.
      - Quy định thi công cho Biệt thự, Nhà liền kề, Shop và Shophouse cần source đúng phạm vi riêng.
      - Cần BQL xác nhận quan hệ giữa ngày 22/07/2026 do người cung cấp xác nhận và ngày 21/04/2026 trong chính văn.
      - Cần BQL làm rõ mức trọng tải cụ thể trong khoảng 3,5-5 tấn theo từng khu vực hoặc điều kiện.

