      - Hồ sơ đăng ký mới Thẻ Xe tháng.
      - Phí cấp mới, cấp lại hoặc đổi thẻ/thuê bao xe máy không có trong nguồn.
      - Quy tắc làm tròn giờ hoặc tính tổng hóa đơn ô tô vãng lai chưa được cung cấp.
