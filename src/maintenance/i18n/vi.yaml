# Lời hiển thị cho cư dân (CR-BPTN-02 §6). Agent không tự viết lời cho cư dân: mọi public_message sinh từ đây.
# Biến trong {} được engine điền; thiếu biến thì engine báo lỗi thay vì hiển thị câu dở.

# CR-BPTN-03 §13: nhãn trạng thái chung cho ticket Bậc 1/Bậc 2 (resident_view ghi đè status_label)
safety_status_label: "Đang được kiểm tra"

status_labels:
  RECEIVED: "Đã tiếp nhận"
  VERIFYING: "Đang xác minh"
  ROUTED: "Đã chuyển phòng ban"
  IN_PROGRESS: "Đang xử lý"
  READY_FOR_REVIEW: "Chờ nghiệm thu"
  CLOSED: "Hoàn thành"
  NEED_INFO: "Chờ bổ sung thông tin"
  ON_HOLD: "Tạm hoãn"
  MERGED: "Đã gộp"
  CANCELLED: "Đã hủy"

# Lời theo trạng thái, dùng khi không có blocker
status_messages:
  RECEIVED: "Phản ánh của bạn đã được tiếp nhận."
  VERIFYING: "Phản ánh đang được xác minh."
  ROUTED: "Phản ánh đã được chuyển tới {department}."
  IN_PROGRESS: "{department} đang xử lý phản ánh."
  READY_FOR_REVIEW: "Đã xử lý xong, đang chờ Ban quản lý nghiệm thu."
  CLOSED: "Phản ánh đã hoàn thành."
  NEED_INFO: "Vui lòng bổ sung thông tin cho phản ánh."
  ON_HOLD: "Việc xử lý đang tạm hoãn."
  MERGED: "Phản ánh đã được gộp vào phản ánh {merged_into}."
  CANCELLED: "Phản ánh đã được hủy. Lý do: {cancel_reason}."

# Lời theo ReasonCode, dùng khi có blocker
reason_messages:
  MISSING_INFO: "Ban tiếp nhận thông tin sẽ liên hệ bạn để bổ sung: {fields}. Bạn cũng có thể bổ sung ngay tại đây."
  DUPLICATE: "Đang kiểm tra phản ánh có trùng với phản ánh khác không."
  CATEGORY_UNCLEAR: "Đang xác minh loại phản ánh."
  OUT_OF_SCOPE: "Đang xác minh phạm vi xử lý của phản ánh."
  PENDING_REVIEW: "Đang xác minh thông tin phản ánh."
  ASSET_UNCLEAR: "Đang xác minh thiết bị tại vị trí phản ánh."
  WAITING_MATERIAL: "Đang chờ vật tư, dự kiến xử lý trước {eta}."
  OUT_OF_HOURS: "Phản ánh sẽ được xử lý từ {dispatch_at}."
  NOT_ACCEPTED: "Phản ánh đang chờ {department} tiếp nhận."
  WRONG_DEPT: "Đang xác minh lại phòng ban phụ trách."
  BLOCKED_ONSITE: "Việc xử lý tạm hoãn, dự kiến tiếp tục trước {eta}."
  REWORK: "{department} đang xử lý lại phản ánh."
  SAFETY_REVIEW_REQUIRED: "Phản ánh đang được kiểm tra."
  EMERGENCY_PENDING_BQL: "Phản ánh đang được kiểm tra."
  WRONG_DEPT_AFTER_START: "Đang xác minh lại phòng ban phụ trách."  # dự phòng Q-A; P0 chưa có đường tạo

# NEED_INFO do tầng an toàn yêu cầu (T06, safety_context): chỉ cư dân trả lời mới gỡ được (plan 02 Q04)
safety_info_message: "Vui lòng bổ sung: {fields}."

# Khi mốc dự kiến (eta) đã qua mà blocker chưa gỡ: không hiển thị một ngày đã qua như thể vẫn đang chờ
overdue_eta_message: "Việc xử lý đang chậm hơn dự kiến (trước {eta}). Ban quản lý đang theo dõi và sẽ cập nhật mốc mới."

# Tên field khi liệt kê thông tin còn thiếu (MISSING_INFO)
field_labels:
  ticket_id: "mã phản ánh"
  created_at: "thời điểm tiếp nhận"
  description: "nội dung phản ánh"
  location: "vị trí (tòa, tầng, khu vực)"
  location_building: "tòa (ghi kèm chữ \"tòa\", ví dụ: tòa SIM-A)"
  location_floor: "tầng (ví dụ: tầng 3)"
  location_area: "khu vực (hành lang, sảnh thang máy, sảnh chính, cầu thang bộ, hầm xe, bãi đỗ xe, phòng rác, sân chơi, sân thượng, lối đi hoặc lối thoát hiểm)"
  safety_details: "mô tả rõ hơn hiện tượng bạn thấy (mùi, khói, tiếng động, thời điểm xảy ra)"  # Q-F

datetime_format: "%H:%M %d/%m/%Y"
