<!doctype html>
<html lang="vi" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaintenanceOps — Theo dõi phản ánh</title>
  <meta name="description" content="Prototype mô phỏng: cư dân gửi phản ánh, BPTN xác minh, phòng ban xử lý, BQL nghiệm thu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Prototype only: the Play CDN compiles classes in the browser. Use the Tailwind CLI for production. -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body class="h-full bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 transition-colors duration-150">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-indigo-700 focus:shadow-lg dark:focus:bg-slate-900 dark:focus:text-indigo-400">
    Bỏ qua tới nội dung chính
  </a>

  <div class="flex min-h-full flex-col">
    <!-- Simulated-data banner: required on every screen (UI rule 1.1) -->
    <div class="bg-amber-50 px-4 py-2 text-center text-xs font-medium text-amber-900 ring-1 ring-inset ring-amber-200 dark:bg-amber-950/70 dark:text-amber-200 dark:ring-amber-900/60">
      DỮ LIỆU MÔ PHỎNG — Không phải hồ sơ hay quy trình vận hành thật.
    </div>

    <header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 transition-colors">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-3 py-3 sm:gap-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-2.5 sm:gap-3">
          <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white shadow-xs" aria-hidden="true">MO</div>
          <div>
            <p class="text-base font-semibold leading-tight text-slate-900 dark:text-white">MaintenanceOps</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">Phản ánh bảo trì khu vực chung</p>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
          <div id="theme-toggle-slot"></div>
          <div id="user-menu" class="flex flex-wrap items-center gap-2 sm:gap-3"></div>
        </div>
      </div>
    </header>

    <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-3 py-4 sm:px-6 sm:py-6 lg:px-8" tabindex="-1">
      <div id="login-view" class="hidden"></div>

      <div id="app-view" class="hidden">
      <div class="mb-4 sm:mb-6">
        <h1 id="view-title" class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white"></h1>
        <p id="view-subtitle" class="mt-1 max-w-3xl text-xs sm:text-sm text-slate-600 dark:text-slate-400"></p>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:gap-6 lg:grid-cols-12">
        <section id="list-pane" class="space-y-4 sm:space-y-6 lg:col-span-5" aria-label="Danh sách"></section>
        <section id="detail-pane" class="lg:col-span-7" aria-label="Chi tiết" aria-live="polite"></section>
      </div>
      </div>
    </main>

    <footer class="border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 transition-colors">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-4 text-xs text-slate-500 dark:text-slate-400 sm:px-6 lg:px-8">
        <p>Prototype CR-BPTN-03 · v0.6 candidate</p>
        <div class="flex flex-wrap items-center gap-2">
          <a href="/docs" class="rounded-md px-2.5 py-1.5 font-medium text-indigo-700 dark:text-indigo-400 underline-offset-2 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600">API docs</a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Toasts: announced to screen readers -->
  <div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4 sm:items-end sm:px-6" role="status" aria-live="polite"></div>

  <!-- Confirmation for destructive actions -->
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body" class="w-full max-w-md rounded-2xl p-0 shadow-2xl backdrop:bg-slate-900/60 dark:bg-slate-900 dark:text-slate-100 dark:ring-1 dark:ring-slate-800">
    <form method="dialog" class="p-6">
      <h2 id="confirm-title" class="text-base font-semibold text-slate-900 dark:text-white"></h2>
      <p id="confirm-body" class="mt-2 text-sm text-slate-600 dark:text-slate-300"></p>
      <div class="mt-6 flex justify-end gap-3">
        <button value="cancel" class="rounded-lg px-3.5 py-2 text-sm font-semibold text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 dark:text-slate-200 dark:ring-slate-700 dark:hover:bg-slate-800">Quay lại</button>
        <button value="ok" class="rounded-lg bg-rose-600 px-3.5 py-2 text-sm font-semibold text-white hover:bg-rose-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-600 focus-visible:ring-offset-2">Xác nhận</button>
      </div>
    </form>
  </dialog>

  <script src="js/dark_mode.js"></script>
  <script src="js/components/agent_proposal.js"></script>
  <script src="js/components/ai_logs_view.js"></script>
  <script src="app.js"></script>
</body>
</html>
