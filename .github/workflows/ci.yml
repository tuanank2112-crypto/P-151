name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        # the two 24 KB linear-time tests assert elapsed < 1 s; coverage tracing slows them, so they run in the next step
        run: >-
          pytest tests/ -v --tb=short --cov=src --cov-report=term --cov-fail-under=60
          --deselect tests/test_maintenance/test_safety.py::test_assess_is_linear_on_a_24kb_text
          --deselect tests/test_maintenance/test_safety.py::test_assess_is_linear_on_adversarial_24kb_texts
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Timing tests without coverage
        run: pytest tests/test_maintenance/test_safety.py -k linear -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
