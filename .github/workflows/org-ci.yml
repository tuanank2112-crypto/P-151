# Runs the org repo's CI on this public repo (org Actions is blocked by billing)
# and reports the result back to the org commit as the status "ci/public-mirror".
# Lives on the default branch `ci-sync` so mirroring main/develop never overwrites it.
# Secret ORG_TOKEN: token with read access to the org repo's code and pull requests
# and write access to its commit statuses.
# The test job runs the `run:` steps of each commit's own .github/workflows/ci.yml.
name: Org CI (public mirror)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-test commits that already have a status"
        type: boolean
        default: false

concurrency:
  group: org-ci
  cancel-in-progress: false

env:
  ORG_REPO: AI20K-Build-Phase-Cohort-4/P-151
  CONTEXT: ci/public-mirror

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - name: Pick org commits without a status
        id: pick
        env:
          GH_TOKEN: ${{ secrets.ORG_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          shas=$( {
            for b in main develop; do gh api "repos/$ORG_REPO/commits/$b" --jq .sha; done
            gh api "repos/$ORG_REPO/pulls?state=open&per_page=50" \
              --jq ".[] | select(.head.repo.full_name == \"$ORG_REPO\") | .head.sha"
          } | sort -u )
          todo=()
          for sha in $shas; do
            if [ "$FORCE" != "true" ] && gh api "repos/$ORG_REPO/commits/$sha/statuses" \
                 --jq ".[] | select(.context == \"$CONTEXT\") | .state" | grep -q .; then
              continue
            fi
            todo+=("$sha")
          done
          targets=$(printf '%s\n' "${todo[@]}" | jq -Rnc '[inputs | select(length > 0)]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "To test: $targets"

  test:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: test ${{ matrix.sha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sha: ${{ fromJson(needs.plan.outputs.targets) }}
    env:
      SHA: ${{ matrix.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # GH_TOKEN is set only on the status steps, never where the org code runs
      - name: Mark the org commit pending
        env:
          GH_TOKEN: ${{ secrets.ORG_TOKEN }}
        run: >-
          gh api "repos/$ORG_REPO/statuses/$SHA" -f state=pending -f context="$CONTEXT"
          -f description="Running ruff + pytest" -f target_url="$RUN_URL"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG_REPO }}
          ref: ${{ matrix.sha }}
          token: ${{ secrets.ORG_TOKEN }}
          persist-credentials: false

      - name: Read the Python version from the commit's ci.yml
        id: py
        run: |
          v=$(yq -r '[.jobs[].steps[] | select((.uses // "") | test("setup-python")) | .with."python-version"][0] // "3.11"' .github/workflows/ci.yml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip

      # Runs every `run:` step of the commit's own .github/workflows/ci.yml in order, with its env,
      # so an old branch is tested with the commands it was written for
      - name: Run the commit's ci.yml steps
        shell: bash
        run: |
          pip install --quiet pyyaml
          python - <<'EOF'
          import os, subprocess, sys, yaml
          wf = yaml.safe_load(open(".github/workflows/ci.yml", encoding="utf-8"))
          job = next(iter(wf["jobs"].values()))
          base = {**os.environ, **{k: str(v) for k, v in (wf.get("env") or {}).items()},
                  **{k: str(v) for k, v in (job.get("env") or {}).items()}}
          for step in job["steps"]:
              if "run" not in step:
                  continue
              name = step.get("name") or step["run"].splitlines()[0]
              print(f"::group::{name}", flush=True)
              env = {**base, **{k: str(v) for k, v in (step.get("env") or {}).items()}}
              code = subprocess.run(["bash", "-eo", "pipefail", "-c", step["run"]], env=env).returncode
              print("::endgroup::", flush=True)
              if code:
                  print(f"::error::{name} failed (exit {code})", flush=True)
                  sys.exit(code)
              print(f"ok: {name}", flush=True)
          EOF

      - name: Report the result to the org commit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ORG_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; desc="ruff + pytest passed" ;;
            failure) state=failure; desc="ruff or pytest failed" ;;
            *)       state=error;   desc="Run $JOB_STATUS" ;;
          esac
          gh api "repos/$ORG_REPO/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f description="$desc" -f target_url="$RUN_URL"
