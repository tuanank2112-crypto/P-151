name: p151

services:
  # Local Postgres for `pytest --pg` (database p151_test) and debugging only; the backend does not use it
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p151}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p151}
      POSTGRES_DB: ${POSTGRES_DB:-p151}
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Expose for local tools (psql, DBeaver) and running uvicorn outside Docker
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # DATABASE_URL comes from .env as is: the shared Supabase DB (Session pooler 5432), never the local "db"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # Uploaded ticket photos and other local data
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cổng phản ánh cư dân (Next.js, portal/): http://localhost:3000. Own database "portal" on the local "db",
  # created + migrated + seeded (only when empty) at start; never the shared Supabase of the backend
  portal:
    build:
      context: ./portal
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-p151}:${POSTGRES_PASSWORD:-p151}@db:5432/portal
      SESSION_COOKIE_SECURE: "false"
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
